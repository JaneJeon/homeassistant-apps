name: XB3 Telemetry
version: 0.4.1
slug: xb3-telemetry
description: Read-only XB3 modem metrics, internet probes and speed tests for Prometheus
url: https://github.com/JaneJeon/homeassistant-apps/tree/main/xb3-telemetry
arch:
  - aarch64
  - amd64
startup: services
init: false
stdin: true
ports:
  19090/tcp: null
ports_description:
  19090/tcp: Optional LAN access to Prometheus metrics (not needed by VictoriaMetrics)
options:
  gateway_url: http://10.0.0.1
  gateway_username: admin
  gateway_password: ""
  log_mode: firewall
  log_interval_seconds: 900
  network_interval_seconds: "20"
  speedtest_interval_minutes: "30"
schema:
  gateway_url: str
  gateway_username: str
  gateway_password: password
  log_mode: list(off|firewall|all)
  log_interval_seconds: int(60,86400)
  network_interval_seconds: list(20|60)
  speedtest_interval_minutes: list(0|15|30|60)
image: ghcr.io/janejeon/xb3-telemetry
