name: VictoriaLogs
version: "0.1.0"
slug: victoria-logs
description: The simple, resource-efficient and fast logs database that scales
url: https://github.com/JaneJeon/homeassistant-apps/tree/main/victoria-logs
ingress: true
ingress_port: 9428
ingress_entry: select/vmui
# host_network: true
ports:
  9428/tcp: 9428
arch:
  - aarch64
  - amd64
#  - i386
init: false
map:
  - share:ro
  - ssl
backup_pre: /backup-pre
backup_exclude:
  - live/
  - work/
image: "ghcr.io/janejeon/victoria-logs"
options:
  bootstrap_mode: restore_only
  retention: "2w"
  additionalArguments: ""
  enableHTTPAuth: false
  username: ""
  password: ""
  homeassistantUrl: ""
schema:
  bootstrap_mode: list(restore_only|import_legacy)
  retention: "str?"
  additionalArguments: "str?"
  enableHTTPAuth: bool
  username: "str?"
  password: "password?"
  homeassistantUrl: "str?"
