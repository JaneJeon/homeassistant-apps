name: MikroTik Telemetry
version: 0.4.0
slug: mikrotik-telemetry
description: Read-only MikroTik availability, WAN traffic, and resource metrics
url: https://github.com/JaneJeon/homeassistant-apps/tree/main/mikrotik-telemetry
arch:
  - aarch64
  - amd64
startup: services
init: false
ports:
  19100/tcp: null
  5514/udp: null
ports_description:
  19100/tcp: Optional LAN access to Prometheus metrics
  5514/udp: RouterOS syslog input; only enabled when VictoriaLogs is configured
options:
  router_host: ""
  wan_interface: ether1
  snmp_username: ha-observability
  snmp_auth_key: ""
  snmp_privacy_key: ""
  poll_interval_seconds: 15
  wifi_clients: []
  victoriametrics_url: ""
  victorialogs_url: ""
schema:
  router_host: str
  wan_interface: str
  snmp_username: str
  snmp_auth_key: password
  snmp_privacy_key: password
  poll_interval_seconds: int(5,300)
  wifi_clients:
    - name: str
      mac: password
  victoriametrics_url: str?
  victorialogs_url: str?
image: ghcr.io/janejeon/mikrotik-telemetry
