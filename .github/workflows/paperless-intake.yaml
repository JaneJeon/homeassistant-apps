name: Paperless Intake tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "paperless-ngx-intake/**"
      - ".github/workflows/paperless-intake.yaml"
  push:
    branches:
      - main
    paths:
      - "paperless-ngx-intake/**"
      - ".github/workflows/paperless-intake.yaml"

permissions:
  contents: read

jobs:
  tests:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: paperless-ngx-intake
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The font draws the synthetic test scans. pdftotext is how Paperless pulls text out of a
      # PDF, so the in-memory Paperless used by the unit tests pulls it out the same way.
      - name: Install the test font, pdftotext and pinned dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core poppler-utils
          python -m pip install --require-hashes --no-deps -r rootfs/requirements.txt

      - name: Unit tests
        working-directory: paperless-ngx-intake/tests
        env:
          PYTHONPATH: ../rootfs/app:.
        run: python -m unittest -v test_google_backend test_page_order test_stack test_checks_and_web test_pipeline test_worker test_documents test_queue test_publisher test_kills

      - name: End-to-end tests against stock Paperless at the tested version
        working-directory: paperless-ngx-intake/tests
        env:
          PYTHONPATH: ../rootfs/app:.
          INTAKE_E2E: "1"
        run: |
          echo "Paperless version under test: $(grep -v '^#' ../rootfs/app/tested-paperless-version)"
          python -m unittest -v test_e2e_paperless

      # Paperless as Jane runs it once Google is the only reader: no Tesseract, no archive files.
      - name: End-to-end tests against Paperless with its own OCR and archive files off
        working-directory: paperless-ngx-intake/tests
        env:
          PYTHONPATH: ../rootfs/app:.
          INTAKE_E2E: "1"
          INTAKE_E2E_PAPERLESS_ENV: "PAPERLESS_OCR_MODE=off,PAPERLESS_ARCHIVE_FILE_GENERATION=never"
        run: python -m unittest -v test_e2e_paperless

      # The setting that would make Paperless re-save the searchable copy. The app must say so.
      - name: The app notices when Paperless is set to archive every PDF
        working-directory: paperless-ngx-intake/tests
        env:
          PYTHONPATH: ../rootfs/app:.
          INTAKE_E2E: "1"
          INTAKE_E2E_PAPERLESS_ENV: "PAPERLESS_ARCHIVE_FILE_GENERATION=always"
          INTAKE_E2E_EXPECT_COPY_REWORKED: "1"
        run: python -m unittest -v test_e2e_paperless.PaperlessE2E.test_commit_reads_back_and_searches_on_google_text
